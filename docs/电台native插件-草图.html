<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>电台 native 插件 · UI 草图（方向 A/B/C）</title>
<style>body { margin: 0; padding: 20px; font-family: system-ui, "Noto Sans CJK SC", sans-serif; }</style>
</head>
<body>
<div id="radio-mock">
  <style>
    #radio-mock {
      --r-bg: light-dark(#eef0f4, #17171b);
      --r-win: light-dark(#ffffff, #242428);
      --r-card: light-dark(#f6f6f8, #2b2b30);
      --r-fg: light-dark(#1c1c1e, #f0f0f3);
      --r-muted: light-dark(#77777e, #9c9ca6);
      --r-border: light-dark(rgba(20,20,30,.1), rgba(255,255,255,.09));
      --r-accent: light-dark(#d95f00, #ff8a3d);
      --r-accent-soft: light-dark(rgba(217,95,0,.12), rgba(255,138,61,.16));
      --r-green: light-dark(#1f9d55, #35c26e);
      --r-dot: light-dark(rgba(20,20,40,.14), rgba(255,255,255,.1));
      font-family: system-ui, "Noto Sans CJK SC", sans-serif;
      color: var(--r-fg);
    }
    #radio-mock .seg { display: inline-flex; gap: 4px; background: var(--r-card); border: 1px solid var(--r-border); border-radius: 12px; padding: 4px; margin-bottom: 14px; }
    #radio-mock .seg button { border: 0; background: transparent; color: var(--r-fg); padding: 7px 16px; border-radius: 9px; font-size: 13px; cursor: pointer; }
    #radio-mock .seg button.on { background: var(--r-accent); color: #fff; }
    #radio-mock .note { font-size: 12px; color: var(--r-muted); margin: 0 0 22px; }
    #radio-mock .win { background: var(--r-win); border: 1px solid var(--r-border); border-radius: 14px; overflow: hidden; box-shadow: 0 14px 40px rgba(0,0,0,.18); max-width: 900px; }
    #radio-mock .tbar { display: flex; align-items: center; padding: 9px 12px; border-bottom: 1px solid var(--r-border); }
    #radio-mock .tbar .t { flex: 1; text-align: center; font-size: 13px; font-weight: 500; color: var(--r-muted); }
    #radio-mock .tbar .b { display: flex; gap: 8px; }
    #radio-mock .tbar .b i { width: 11px; height: 11px; border-radius: 50%; background: var(--r-border); display: block; }
    #radio-mock [hidden] { display: none !important; }
    /* —— 方向 A —— */
    #radio-mock .a-body { display: flex; min-height: 430px; }
    #radio-mock .side { width: 168px; border-right: 1px solid var(--r-border); padding: 10px 8px; flex-shrink: 0; }
    #radio-mock .side h5 { margin: 8px 6px 4px; font-size: 11px; font-weight: 500; color: var(--r-muted); }
    #radio-mock .side button { display: flex; justify-content: space-between; align-items: center; width: 100%; border: 0; background: transparent; color: var(--r-fg); text-align: left; font-size: 13px; padding: 6px 10px; border-radius: 8px; cursor: pointer; }
    #radio-mock .side button.on { background: var(--r-accent-soft); color: var(--r-accent); font-weight: 500; }
    #radio-mock .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    #radio-mock .srow { display: flex; align-items: center; gap: 8px; padding: 10px 14px 8px; }
    #radio-mock .srow input { flex: 1; border: 1px solid var(--r-border); background: var(--r-card); color: var(--r-fg); border-radius: 9px; padding: 7px 12px; font-size: 13px; outline: none; }
    #radio-mock .srow .cnt { font-size: 12px; color: var(--r-muted); white-space: nowrap; }
    #radio-mock .cards { overflow-y: auto; padding: 4px 14px 12px; display: flex; flex-direction: column; gap: 8px; }
    #radio-mock .ch { display: flex; gap: 12px; align-items: center; background: var(--r-card); border-radius: 12px; padding: 10px 12px; }
    #radio-mock .ch.playing { outline: 1.5px solid var(--r-accent); }
    #radio-mock .cov { width: 52px; height: 52px; border-radius: 10px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 500; font-size: 15px; letter-spacing: 1px; }
    #radio-mock .ch .info { flex: 1; min-width: 0; }
    #radio-mock .ch .n { font-size: 13.5px; font-weight: 500; display: flex; gap: 6px; align-items: center; }
    #radio-mock .ch .np { font-size: 11.5px; color: var(--r-accent); }
    #radio-mock .ch .meta { font-size: 11.5px; color: var(--r-muted); }
    #radio-mock .ch .ops { display: flex; gap: 6px; }
    #radio-mock .ch .ops button, #radio-mock .pbar button { border: 1px solid var(--r-border); background: transparent; color: var(--r-fg); border-radius: 8px; padding: 5px 10px; font-size: 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
    #radio-mock .ch .ops button.p { background: var(--r-accent); border-color: var(--r-accent); color: #fff; }
    #radio-mock .fav.on { color: var(--r-accent); border-color: var(--r-accent); }
    #radio-mock .pbar { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-top: 1px solid var(--r-border); background: var(--r-card); }
    #radio-mock .pbar .pc { width: 34px; height: 34px; border-radius: 9px; background: var(--r-accent); color: #fff; display: flex; align-items: center; justify-content: center; border: 0; cursor: pointer; flex-shrink: 0; }
    #radio-mock .pbar .pi { flex: 1; min-width: 0; }
    #radio-mock .pbar .pi .a { font-size: 13px; font-weight: 500; }
    #radio-mock .pbar .pi .b { font-size: 11.5px; color: var(--r-muted); }
    #radio-mock .pbar input[type=range] { width: 130px; accent-color: var(--r-accent); }
    #radio-mock .pbar .vol { display: flex; align-items: center; gap: 6px; color: var(--r-muted); font-size: 12px; }
    /* —— 方向 B —— */
    #radio-mock .btabs { display: flex; gap: 2px; padding: 8px 12px 0; border-bottom: 1px solid var(--r-border); }
    #radio-mock .btabs button { border: 0; background: transparent; color: var(--r-muted); font-size: 13.5px; padding: 8px 14px; cursor: pointer; border-radius: 8px 8px 0 0; border-bottom: 2px solid transparent; }
    #radio-mock .btabs button.on { color: var(--r-accent); border-bottom-color: var(--r-accent); font-weight: 500; }
    #radio-mock .blist { padding: 10px 14px 14px; min-height: 380px; }
    #radio-mock .grp { font-size: 11.5px; color: var(--r-muted); margin: 10px 2px 6px; }
    #radio-mock .row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; background: var(--r-card); margin-bottom: 6px; }
    #radio-mock .row .cov { width: 38px; height: 38px; border-radius: 8px; font-size: 12px; }
    #radio-mock .row .n { font-size: 13px; font-weight: 500; }
    #radio-mock .row .m { font-size: 11.5px; color: var(--r-muted); }
    /* —— 方向 C —— */
    #radio-mock .c-body { display: flex; flex-direction: column; align-items: center; padding: 26px 20px 18px; }
    #radio-mock .bigcov { width: 168px; height: 168px; border-radius: 20px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 34px; font-weight: 500; letter-spacing: 3px; box-shadow: 0 18px 44px rgba(0,0,0,.28); }
    #radio-mock .c-np { margin-top: 16px; font-size: 12.5px; color: var(--r-accent); display: flex; align-items: center; gap: 6px; }
    #radio-mock .c-name { font-size: 19px; font-weight: 500; margin-top: 3px; }
    #radio-mock .c-meta { font-size: 12px; color: var(--r-muted); margin-top: 2px; }
    #radio-mock .c-ctl { display: flex; align-items: center; gap: 22px; margin-top: 18px; }
    #radio-mock .c-ctl .mainp { width: 58px; height: 58px; border-radius: 50%; border: 0; background: var(--r-accent); color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    #radio-mock .c-ctl button.sm { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--r-border); background: transparent; color: var(--r-fg); cursor: pointer; display: flex; align-items: center; justify-content: center; }
    #radio-mock .c-hint { margin-top: 18px; display: flex; gap: 8px; }
    #radio-mock .c-hint span { font-size: 11.5px; color: var(--r-muted); border: 1px dashed var(--r-border); padding: 4px 10px; border-radius: 999px; }
    #radio-mock .ann { max-width: 900px; margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
    #radio-mock .ann span { font-size: 11.5px; color: var(--r-muted); background: var(--r-card); border: 1px solid var(--r-border); border-radius: 999px; padding: 3px 10px; }
    #radio-mock .live { display: inline-flex; align-items: center; gap: 4px; }
    #radio-mock .live::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--r-green); }
    #radio-mock svg.luc { width: 14px; height: 14px; }
    @media (prefers-reduced-motion: no-preference) { #radio-mock .live::before { animation: rm-pulse 1.6s infinite; } @keyframes rm-pulse { 50% { opacity: .35; } } }
  </style>

  <div class="seg" role="tablist" aria-label="设计方向">
    <button type="button" class="on" data-v="a">方向 A · 双侧栏卡片墙</button>
    <button type="button" data-v="b">方向 B · 顶部 Tab</button>
    <button type="button" data-v="c">方向 C · 播放器优先</button>
  </div>
  <p class="note" id="rm-note">墨鱼 FM 同构：分类 × 地区双侧栏交叉过滤（billboards 榜单），封面卡片 + 常驻播放条，首屏默认收藏。</p>

  <div class="win" id="rm-win">
    <div class="tbar"><span class="b"><i></i><i></i><i></i></span><span class="t">电台</span><span class="b" style="visibility:hidden"><i></i><i></i><i></i></span></div>

    <div id="rm-a">
      <div class="a-body">
        <div class="side">
          <h5>分类</h5>
          <div id="rm-cats"></div>
          <h5>地区</h5>
          <div id="rm-regs"></div>
        </div>
        <div class="main">
          <div class="srow">
            <input id="rm-q" type="text" placeholder="搜索电台，如 交通91.8" aria-label="搜索电台">
            <span class="cnt" id="rm-cnt"></span>
          </div>
          <div class="cards" id="rm-cards"></div>
          <div class="pbar">
            <button class="pc" id="rm-pc" aria-label="播放/暂停"><svg class="luc" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
            <div class="pi"><div class="a" id="rm-pa">未在播放</div><div class="b" id="rm-pb">选台后点「播放」，收起面板不中断</div></div>
            <div class="vol"><svg class="luc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg><input type="range" min="0" max="100" value="80" aria-label="音量"><span>80</span></div>
          </div>
        </div>
      </div>
    </div>

    <div id="rm-b" hidden>
      <div class="btabs" role="tablist" aria-label="电台视图">
        <button type="button" class="on" data-t="fav">收藏</button>
        <button type="button" data-t="cat">分类</button>
        <button type="button" data-t="reg">地区</button>
        <button type="button" data-t="search">搜索</button>
      </div>
      <div class="blist" id="rm-blist"></div>
    </div>

    <div id="rm-c" hidden>
      <div class="c-body">
        <div class="bigcov" id="rm-ccov">FM93</div>
        <div class="c-np"><span class="live">正在播</span> 晚高峰在线（16:00–17:00）</div>
        <div class="c-name" id="rm-cname">FM93 浙江交通之声</div>
        <div class="c-meta" id="rm-cmeta">交通台 · 杭州 · 2.1万听众</div>
        <div class="c-ctl">
          <button class="sm" aria-label="收藏"><svg class="luc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 2 3.09 6.26L22 9.27l-5 4.87L18.18 21 12 17.77 5.82 21 7 14.14l-5-4.87 7-1.01z"/></svg></button>
          <button class="mainp" aria-label="播放/暂停"><svg class="luc" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
          <button class="sm" aria-label="更多"><svg class="luc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg></button>
        </div>
        <div class="c-hint"><span>收藏</span><span>分类浏览</span><span>地区浏览</span><span>搜索</span></div>
      </div>
    </div>
  </div>
  <div class="ann" id="rm-ann"></div>

  <script>
  (function () {
    const root = document.getElementById('radio-mock');
    const CH = [
      { n: 'FM93 浙江交通之声', cat: '交通台', city: '杭州', reg: '浙江', aud: '2.1万', np: '晚高峰在线', h: 210 },
      { n: '杭州交通91.8', cat: '交通台', city: '杭州', reg: '浙江', aud: '1.4万', np: '爱车轻松听', h: 152 },
      { n: '浙江之声', cat: '新闻台', city: '杭州', reg: '浙江', aud: '9800', np: '浙江新闻联播', h: 262 },
      { n: '北京交通广播', cat: '交通台', city: '北京', reg: '北京', aud: '3.5万', np: '一路畅通', h: 4 },
      { n: '上海交通广播', cat: '交通台', city: '上海', reg: '上海', aud: '2.8万', np: '欢乐晚高峰', h: 330 },
      { n: '湖南交通频道', cat: '交通台', city: '长沙', reg: '湖南', aud: '1.2万', np: '超级新闻场', h: 28 },
      { n: '内蒙古交通之声', cat: '交通台', city: '呼和浩特', reg: '内蒙古', aud: '6400', np: '汽车公园', h: 192 },
      { n: 'FM94.9 包头综合广播', cat: '新闻台', city: '包头', reg: '内蒙古', aud: '3200', np: '经典好时光', h: 118 }
    ];
    const CATS = ['推荐', '新闻台', '音乐台', '交通台', '经济台', '文艺台', '生活台'];
    const REGS = ['全国', '浙江', '北京', '上海', '湖南', '内蒙古'];
    const NOTES = {
      a: ['墨鱼 FM 同构：分类 × 地区双侧栏交叉过滤（billboards 榜单）', '封面卡片：封面图 + 🔴正在播节目 + 听众数 + 内联播放/收藏', '底部常驻播放条，收起面板播放不中断', '首屏默认「收藏」，「推荐」= 全站热度榜'],
      b: ['四个 Tab 单维聚焦：每屏只做一件事', '实现最简、信息密度低', '分类/地区不能交叉过滤（可用地区内分组补偿）'],
      c: ['打开即播放器：听感仪式感最强', '适合「打开就听固定台」的收藏党', '浏览发现能力弱，列表收进抽屉']
    };
    const aud = s => parseFloat(s) || 0;
    let cur = 'a', playing = null;
    const favs = new Set(['FM93 浙江交通之声', '杭州交通91.8']);
    let sel = { cat: '推荐', reg: '全国' };
    const cov = (c, t) => `<div class="cov" style="background:linear-gradient(135deg,hsl(${c.h},62%,46%),hsl(${(c.h + 40) % 360},58%,30%))">${t}</div>`;
    const listA = () => {
      let r = CH;
      if (sel.cat !== '推荐') r = r.filter(c => c.cat === sel.cat);
      if (sel.reg !== '全国') r = r.filter(c => c.reg === sel.reg);
      if (sel.cat === '推荐') r = [...r].sort((x, y) => aud(y.aud) - aud(x.aud));
      return r;
    };
    function drawA() {
      const cats = document.getElementById('rm-cats');
      cats.innerHTML = CATS.map(c => `<button type="button" class="${sel.cat === c ? 'on' : ''}" data-k="cat" data-v="${c}">${c}</button>`).join('');
      const regs = document.getElementById('rm-regs');
      regs.innerHTML = REGS.map(c => `<button type="button" class="${sel.reg === c ? 'on' : ''}" data-k="reg" data-v="${c}">${c}</button>`).join('');
      const q = document.getElementById('rm-q').value.trim();
      let rows = listA();
      if (q) rows = rows.filter(c => c.n.toLowerCase().includes(q.toLowerCase()));
      document.getElementById('rm-cnt').textContent = `${rows.length} 个台`;
      document.getElementById('rm-cards').innerHTML = rows.map(c => {
        const isP = playing === c.n;
        const isF = favs.has(c.n);
        return `<div class="ch ${isP ? 'playing' : ''}">
          ${cov(c, c.n.replace(/^FM\s*/, '').slice(0, 2))}
          <div class="info">
            <div class="n">${c.n}${isP ? '<span class="live" style="font-size:11px">正在播放</span>' : ''}</div>
            <div class="np">🔴 正在播：${c.np}</div>
            <div class="meta">${c.cat} · ${c.city} · ${c.aud} 听众</div>
          </div>
          <div class="ops">
            <button type="button" class="p" data-play="${c.n}">${isP ? '⏸ 暂停' : '▶ 播放'}</button>
            <button type="button" class="fav ${isF ? 'on' : ''}" data-fav="${c.n}">${isF ? '★ 已藏' : '☆ 收藏'}</button>
          </div>
        </div>`;
      }).join('') || '<div style="padding:20px;color:var(--r-muted);font-size:13px">该组合下暂无电台，换个分类或地区试试</div>';
      root.querySelectorAll('#rm-cards [data-play]').forEach(b => b.addEventListener('click', () => play(b.dataset.play)));
      root.querySelectorAll('#rm-cards [data-fav]').forEach(b => b.addEventListener('click', () => { const n = b.dataset.fav; favs.has(n) ? favs.delete(n) : favs.add(n); drawA(); }));
    }
    function play(n) {
      playing = playing === n ? null : n;
      const c = CH.find(x => x.n === n);
      const pa = document.getElementById('rm-pa'), pb = document.getElementById('rm-pb'), pc = document.getElementById('rm-pc');
      if (playing && c) {
        pa.textContent = `${c.n}`;
        pb.textContent = `正在播：${c.np} · 音量 80（宿主 gst-play 代执行）`;
        pc.innerHTML = '<svg class="luc" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';
      } else {
        playing = null;
        pa.textContent = '未在播放'; pb.textContent = '选台后点「播放」，收起面板不中断';
        pc.innerHTML = '<svg class="luc" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
      }
      drawA();
    }
    root.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
      cur = b.dataset.v;
      root.querySelectorAll('.seg button').forEach(x => x.classList.toggle('on', x === b));
      document.getElementById('rm-a').hidden = cur !== 'a';
      document.getElementById('rm-b').hidden = cur !== 'b';
      document.getElementById('rm-c').hidden = cur !== 'c';
      document.getElementById('rm-note').textContent = NOTES[cur];
      document.getElementById('rm-ann').innerHTML = '';
    }));
    catsSide: root.addEventListener('click', e => {
      const b = e.target.closest('[data-k]');
      if (b) { sel[b.dataset.k] = b.dataset.v; drawA(); }
    });
    document.getElementById('rm-q').addEventListener('input', drawA);
    drawA();

    let btab = 'fav';
    root.querySelectorAll('.btabs button').forEach(b => b.addEventListener('click', () => {
      btab = b.dataset.t;
      root.querySelectorAll('.btabs button').forEach(x => x.classList.toggle('on', x === b));
      drawB();
    }));
    function drawB() {
      const el = document.getElementById('rm-blist');
      const row = c => `<div class="row">${cov(c, c.n.replace(/^FM\s*/, '').slice(0, 2))}<div style="flex:1"><div class="n">${c.n}</div><div class="m">${c.np ? '🔴 ' + c.np + ' · ' : ''}${c.cat} · ${c.city}</div></div><button type="button" class="${playing === c.n ? 'p' : ''}" style="border:1px solid var(--r-border);background:${playing === c.n ? 'var(--r-accent)' : 'transparent'};color:${playing === c.n ? '#fff' : 'var(--r-fg)'};border-radius:8px;padding:4px 10px;font-size:12px;cursor:pointer" data-play="${c.n}">▶</button></div>`;
      let html = '';
      if (btab === 'fav') {
        const f = CH.filter(c => favs.has(c.n));
        html = (f.map(row).join('') || '<div style="color:var(--r-muted);font-size:13px;padding:16px 4px">还没有收藏，去分类/搜索里点「☆ 收藏」</div>');
      } else if (btab === 'cat') {
        for (const cat of [...new Set(CH.map(c => c.cat))]) html += `<div class="grp">${cat}</div>` + CH.filter(c => c.cat === cat).map(row).join('');
      } else if (btab === 'reg') {
        for (const reg of [...new Set(CH.map(c => c.reg))]) html += `<div class="grp">${reg}</div>` + CH.filter(c => c.reg === reg).map(row).join('');
      } else {
        html = `<div style="margin-bottom:10px"><input type="text" placeholder="搜索电台，回车触发" aria-label="搜索" style="width:100%;border:1px solid var(--r-border);background:var(--r-card);color:var(--r-fg);border-radius:9px;padding:8px 12px;font-size:13px"></div>` + CH.slice(0, 4).map(row).join('');
      }
      el.innerHTML = html;
      el.querySelectorAll('[data-play]').forEach(b => b.addEventListener('click', () => play(b.dataset.play)));
    }
    drawB();
  })();
  </script>
</div>

</body>
