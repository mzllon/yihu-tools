[package]
name = "radio-player"
version.workspace = true
edition.workspace = true
description = "一呼电台 native 官方插件：播放器优先的独立 GTK4 窗体"

[dependencies]
yihu-core = { path = "../../crates/yihu-core" }
gtk = { package = "gtk4", version = "0.9", features = ["v4_12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls", "gzip"] }
libc = "0.2"
