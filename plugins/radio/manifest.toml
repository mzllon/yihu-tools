id = "radio"
name = "电台"
version = "2.0.0-native"
api = "^1"
kind = "native"
entry = "radio-player"
icon = "applications-multimedia-symbolic"
# 面板出行入口（mini 壳，WASM 运行时承载）：控制台入口行 / 正在播状态行 /
# 面板直搜即播。窗体进程由激活动作按需拉起（GApplication 单实例转发）。
panel_entry = "panel.wasm"

# native 官方可信直连：permissions 是能力契约的展示与审计对照（不经能力
# 代理强制）；panel.wasm 的能力面（network.fetch 搜索 + fs.read 状态）按
# 同一声明装载期校验。
# 注意 permissions 必须位于任何 [[triggers]] 段之前（TOML 段归属约定）。
permissions = [
    "network.fetch@rapi.qtfm.cn",
    "network.fetch@rapi.qingting.fm",
    "network.fetch@search.qingting.fm",
    "network.fetch@ls.qingting.fm",
    "network.fetch@pic.qtfm.cn",
    "audio.play@ls.qingting.fm",
    "audio.stop",
    "audio.volume",
    "fs.read@~/.local/share/yihu/plugin-data/radio/status.json",
]

[[triggers]]
keywords = ["radio", "电台", "广播", "fm", "收音机"]
